<!DOCTYPE html>
<html>

<head>
    <title>Student Portal — Home</title>
    <link rel="icon" type="image/png" href="C:\Users\ompat\Downloads\14772982.png">
    <link rel="stylesheet" href="portal.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 24px;
        }

        .home-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: 52px 56px;
            text-align: center;
            max-width: 440px;
            width: 100%;
        }

        .home-card h1 {
            font-size: 2.1rem;
            margin-bottom: 10px;
        }

        .home-card .tagline {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .home-card .divider {
            height: 1px;
            background: var(--border);
            margin: 0 0 32px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn-group a { flex: 1; }

        .btn-group button {
            width: 100%;
            padding: 12px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="home-card">
        <h1>&#127979; Student Portal</h1>
        <p class="tagline">Your academic dashboard — manage fees,<br>clubs, events &amp; more.</p>
        <div class="divider"></div>
        <div class="btn-group">
            <a href="login.html">
                <button>Login</button>
            </a>
            <a href="login.html">
                <button class="btn-outline" onclick="sessionStorage.setItem('openTab','reg')">Register</button>
            </a>
        </div>
    </div>

    <script src="../scripts/portal.js"></script>
    <script>redirectIfLoggedIn();</script>

</body>

</html>
