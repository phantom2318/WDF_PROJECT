    <table border="1" width="100%">

    <table border="1" width="100%" cellpadding="10" height="300">

            <td width="50%" valign="top" style="vertical-align: top;" id="result-section">

                <p>Click the button below to check your results.</p>
                <button onclick="toggleResultForm()">Check Results</button>
                
                <br><br>

                    <p style="margin-bottom: 6px;"><b>Semester:</b></p>
                    <input type="number" id="semester-input" style="width: 100%; margin-bottom: 16px;" min="1" max="8">
                    
                    <p style="margin-bottom: 6px;"><b>Exam Type:</b></p>
                    <select id="exam-input" style="width: 100%; margin-bottom: 20px;">
                        <option value="Middle Term">Middle Term</option>
                        <option value="University">University</option>
                    </select>
                    
                    <button onclick="displayResult()" style="width: 100%;">View</button>
                </div>

                <br>
                <div id="result-display"></div>
            </td>

            <!-- Section 2: Timetable -->
            <td width="50%" valign="top" style="vertical-align: top;" id="timetable-section">
                <h3>Timetable</h3>
                <p>Timetable details will go here...</p>
            </td>
        </tr>
        <tr>
            <!-- Section 3: Attendance -->

            </td>

            <!-- Section 4: Blank for now -->
            <td width="50%" valign="top" style="vertical-align: top;" id="blank-section">
                
            </td>
        </tr>
