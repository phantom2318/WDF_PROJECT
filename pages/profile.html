    <table border="1" width="100%">

    </table>

    <br>

    <table border="1" width="100%" cellpadding="10">
        <tr>
            <td width="30%" align="center" valign="top">
                <br>
                <img src="C:\Users\ompat\Downloads\cat.png" alt="Profile Picture" width="150" height="150">
                <h2 data-profile="fullName"></h2>
                <p><b>Student ID:</b> <span data-profile="studentId"></span></p>
                <p><b>Department:</b> <span data-profile="department"></span></p>
                <p><b>Semester:</b> <span data-profile="semester"></span></p>
                <br>
                <button>Edit Profile</button><br><br>
                <button>Change Password</button>
                <br><br>
            </td>

            <td width="70%" valign="top">

                <h3>Personal Information</h3>
                <table border="1" width="100%" cellpadding="5">
                    <tr>
                        <td width="30%"><b>First Name:</b></td>
                        <td><span data-profile="firstName"></span></td>
                    </tr>
                    <tr>
                        <td><b>Middle Name:</b></td>
                        <td><span data-profile="middleName"></span></td>
                    </tr>
                    <tr>
                        <td><b>Last Name:</b></td>
                        <td><span data-profile="lastName"></span></td>
                    </tr>
                    <tr>
                        <td><b>Date of Birth:</b></td>
                        <td><span data-profile="dob"></span></td>
                    </tr>
                    <tr>
                        <td><b>Gender:</b></td>
                        <td><span data-profile="gender"></span></td>
                    </tr>
                    <tr>
                        <td><b>Blood Group:</b></td>
                        <td><span data-profile="bloodGroup"></span></td>
                    </tr>
                </table>

                <br>

                <h3>Contact Information</h3>
                <table border="1" width="100%" cellpadding="5">
                    <tr>
                        <td width="30%"><b>Email Address:</b></td>
                        <td><span data-profile="email"></span></td>
                    </tr>
                    <tr>
                        <td><b>Phone Number:</b></td>
                        <td><span data-profile="phone"></span></td>
                    </tr>
                    <tr>
                        <td><b>Address:</b></td>
                        <td><span data-profile="address"></span></td>
                    </tr>
                </table>

                <br>

                <h3>Academic Summary</h3>
                <table border="1" width="100%" cellpadding="5">
                    <tr>
                        <td width="30%"><b>Course / Program:</b></td>
                        <td><span data-profile="course"></span></td>
                    </tr>
                    <tr>
                        <td><b>Year / Semester:</b></td>
                        <td><span data-profile="year"></span>nd Year / <span data-profile="semester"></span></td>
                    </tr>
                    <tr>
                        <td><b>CGPA:</b></td>
                        <td><span data-profile="cgpa"></span></td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</html>
